<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Send a Bouquet</title>
<style>
  :root { --bg: #07060a; --ink: #efe7da; --muted: rgba(239,231,218,.62); --accent: #e8344a; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 14px; text-align: center; padding: 24px 16px; }
  h1 { margin: 0; font: italic 500 34px/1.1 Georgia, "Times New Roman", serif; }
  p { margin: 0; color: var(--muted); }
  a { justify-self: center; margin-top: 8px; color: #fff; background: var(--accent); text-decoration: none; font-weight: 700; padding: 13px 18px; border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>This bouquet wandered off.</h1>
  <p>The link may be incomplete. Ask whoever sent it to copy it again.</p>
  <a href="/">Make a bouquet</a>
</main>
</body>
</html>
